<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🤖 Tank</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Servo Control</h1>
    <div class="servo">
      <h2>Channel 0</h2>
      <div class="value">
        <span id="value0">90</span>°
      </div>
      <input type="range" min="0" max="180" value="90" id="slider0" oninput="servoChanged(0, this.value)">
    </div>

    <div class="servo">
      <h2>Channel 1</h2>
      <div class="value">
        <span id="value1">90</span>°
      </div>
      <input type="range" min="0" max="180" value="90" id="slider1" oninput="servoChanged(1, this.value)">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
